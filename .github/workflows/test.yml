name: 单元测试

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 只装测试需要的轻量依赖，不装 PyTorch
      - run: pip install pytest pillow pyyaml
      - run: pytest -q
