# 所有实验共用的默认配置。具体实验的配置文件用 `_base_: base.yaml` 继承本文件，只写不同的部分。

seed: 42
device: auto            # auto / cuda / mps / cpu

data:
  dataset: sroie        # sroie / cord
  processed_dir: data/processed
  image_root: data      # jsonl 里的 image_path 相对于这个目录

layoutlm:
  model_name: microsoft/layoutlmv3-base
  max_length: 512
  batch_size: 4
  grad_accum: 4
  lr: 5.0e-5
  epochs: 30
  fp16: false
  bf16: true            # 5060 Ti 支持 bf16

vlm:
  model_name: Qwen/Qwen2.5-VL-3B-Instruct
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]
  lr: 1.0e-4
  epochs: 3
  batch_size: 1
  grad_accum: 8
  max_new_tokens: 256

router:
  # 路由网络（主方法）
  method: rescue_net        # rescue_net（本文）/ error_net / confidence / random / whole_doc
  target: rescue            # rescue：小模型错且大模型对为正样本；error：小模型错即为正样本
  features: [hidden, confidence, entropy, field_type, position, consistency]
  hidden_pool: attention    # 隐藏层向量的池化方式：attention / mean
  mlp_hidden: 256
  dropout: 0.1
  loss: focal               # focal / weighted_bce，用于应对正样本稀少
  lr: 1.0e-3
  epochs: 50
  cv_folds: 5               # 小模型交叉验证折数，用于生成路由训练数据
  budget: 0.2               # 默认调用预算：最多送 20% 的字段给大模型（实验中会扫描多个预算）
  # 置信度阈值对照组
  field_confidence: min     # 字段置信度如何由词级概率聚合：min / mean / first
  calibrate: true           # 温度缩放校准；对照组需同时报告校准与未校准
  # 一致性约束
  consistency:
    amount_tolerance: 0.01  # 金额比较的容差（相对值）
    targeted_prompt: true   # 复核时附上不一致信息

output_dir: outputs
